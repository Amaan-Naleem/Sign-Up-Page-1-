<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create your account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/font end/css/style.css">
</head>
<body>
  <main class="shell">

    <section class="art" aria-hidden="true">
      <span class="orb orb-a"></span>
      <span class="orb orb-b"></span>
      <span class="orb orb-c"></span>

      <div class="brand">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="14" r="13" stroke="currentColor" stroke-width="2"/>
          <path d="M8 15c2.5-5 9.5-5 12 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>Your Brand</span>
      </div>

      <div class="art-copy">
        <h2>Start something worth coming back to.</h2>
        <p>One account. Takes under a minute.</p>
      </div>
    </section>

    <section class="panel">
      <form id="signupForm" class="form" novalidate>
        <h1 class="rise" style="--i:0">Create your account</h1>
        <p class="sub rise" style="--i:1">Already have one? <a href="#">Log in</a></p>

        <div class="field rise" style="--i:2">
          <input id="name" name="name" type="text" placeholder=" " autocomplete="name">
          <label for="name">Full name</label>
          <span class="msg" id="nameMsg" role="alert"></span>
        </div>

        <div class="field rise" style="--i:3">
          <input id="email" name="email" type="email" placeholder=" " autocomplete="email">
          <label for="email">Email address</label>
          <span class="msg" id="emailMsg" role="alert"></span>
        </div>

        <div class="field rise" style="--i:4">
          <input id="phone" name="phone" type="tel" inputmode="tel" placeholder=" " autocomplete="tel">
          <label for="phone">Phone number</label>
          <span class="msg" id="phoneMsg" role="alert"></span>
        </div>

        <div class="field rise" style="--i:5">
          <input id="password" name="password" type="password" placeholder=" " autocomplete="new-password">
          <label for="password">Password</label>
          <button type="button" class="toggle" id="togglePw" aria-label="Show password">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
              <circle cx="12" cy="12" r="3"/>
              <line class="slash" x1="4" y1="4" x2="20" y2="20"/>
            </svg>
          </button>
          <div class="strength" id="strength" data-level="0" aria-hidden="true">
            <i></i><i></i><i></i><i></i>
          </div>
          <span class="msg" id="passwordMsg" role="alert"></span>
        </div>

        <button type="submit" class="submit rise" style="--i:6" id="submitBtn">
          <span class="label">Create account</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>

        <p class="terms rise" style="--i:7">By creating an account you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
      </form>

      <div class="success" id="success" hidden>
        <svg class="check" viewBox="0 0 80 80" fill="none">
          <circle class="ring" cx="40" cy="40" r="36" stroke="currentColor" stroke-width="4"/>
          <path class="tick" d="M24 41l11 11 21-23" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h2 id="successTitle">You're in.</h2>
        <p>Your account has been created.</p>
        <button type="button" class="ghost" id="resetBtn" onclick="signup();">Back to sign up</button>
      </div>
    </section>

  </main>
    <script src="assets/font end/js/script.js"></script>
</body>
</html>
